<meta charset="utf-8">
<title>__DIAGRAM_TITLE__</title>
<style>
  :root{
    --bg:#0B0C0E; --surface:#1F1F1F; --elevated:#26272B;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
    --fg:#FFFFFF; --fg3:rgba(255,255,255,0.52); --accent:#0062FF; --canvas:#E9EDF0;
    font-family:'Open Sans',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);overflow:hidden}
  #app{position:absolute;inset:0;display:flex;flex-direction:column}
  #bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
  #bar .title{font-weight:700;margin-right:8px}
  button.tb{border:1px solid var(--border);background:var(--elevated);color:var(--fg);min-width:30px;height:30px;padding:0 9px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
  button.tb:hover{border-color:var(--border-strong);background:#2f3035}
  #zl{min-width:44px;text-align:center;color:var(--fg3);font-variant-numeric:tabular-nums;font-size:12px}
  #wrap{flex:1;overflow:auto;cursor:grab;background:var(--canvas)}
  #wrap.grabbing{cursor:grabbing}
  #host{display:inline-block;padding:14px;transform-origin:0 0}
  #host svg{display:block}
</style>

<div id="app">
  <div id="bar">
    <span class="title">__DIAGRAM_TITLE__</span>
    <button class="tb" id="z-out">−</button><span id="zl">100%</span><button class="tb" id="z-in">＋</button>
    <button class="tb" id="fit">Ajustar</button>
    <button class="tb" id="fs" title="Pantalla completa">⛶</button>
    <button class="tb" id="dl">SVG</button>
  </div>
  <div id="wrap"><div id="host"></div></div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var model=__SWIMLANE_JSON__;

  var GUT=120, laneW=260, headerH=46, padT=8, rowH=76;
  function build(m){
    var lanes=m.lanes, nodes=m.nodes;
    var laneIdx={}; lanes.forEach(function(l,i){laneIdx[l.id]=i;});
    var maxRow=nodes.reduce(function(a,n){return Math.max(a,n.row);},0);
    var W=GUT+lanes.length*laneW+16, H=padT+headerH+(maxRow+1)*rowH+20;
    var laneX=function(id){return GUT+laneIdx[id]*laneW+laneW/2;};
    var rowY=function(r){return padT+headerH+r*rowH+rowH/2;};
    var half=function(t){return (t==='start'||t==='end'||t==='idok')?16:(t==='gw'?24:26);};
    var wOf=function(t){return t==='gw'?48:laneW-72;};
    var leftOf=function(n){return laneX(n.lane)-(n.type==='gw'?24:(n.type==='task'?(laneW-72)/2:16));};
    var esc=function(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
    var byId={}; nodes.forEach(function(n){byId[n.id]=n;});

    var o=[];
    o.push('<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg" font-family="Open Sans, Arial, sans-serif">');
    o.push('<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6472"/></marker></defs>');
    lanes.forEach(function(l,i){
      var x=GUT+i*laneW;
      o.push('<rect x="'+x+'" y="'+(padT+headerH)+'" width="'+laneW+'" height="'+((maxRow+1)*rowH)+'" fill="'+l.band+'"/>');
      if(i>0) o.push('<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(H-14)+'" stroke="rgba(0,0,0,0.12)"/>');
      o.push('<rect x="'+x+'" y="'+padT+'" width="'+laneW+'" height="'+headerH+'" fill="#ffffff" stroke="rgba(0,0,0,0.12)"/>');
      o.push('<text x="'+(x+laneW/2)+'" y="'+(padT+headerH/2+4)+'" text-anchor="middle" font-size="12.5" font-weight="800" fill="'+l.tx+'">'+esc(l.name)+'</text>');
    });
    o.push('<rect x="'+GUT+'" y="'+padT+'" width="'+(lanes.length*laneW)+'" height="'+((maxRow+1)*rowH+headerH)+'" fill="none" stroke="rgba(0,0,0,0.18)"/>');

    var gk=0;
    m.edges.forEach(function(e){
      var a=byId[e.from], b=byId[e.to]; if(!a||!b) return;
      var ax=laneX(a.lane), ay=rowY(a.row), bx=laneX(b.lane), by=rowY(b.row);
      var aH=half(a.type), bH=half(b.type), rd=b.row-a.row, d, lx, ly;
      if(rd>0 && a.lane===b.lane){ d='M '+ax+' '+(ay+aH)+' L '+bx+' '+(by-bH); lx=ax+8; ly=(ay+by)/2; }
      else if(rd>0){ var y1=ay+aH, y2=by-bH, my=(y1+y2)/2; d='M '+ax+' '+y1+' L '+ax+' '+my+' L '+bx+' '+my+' L '+bx+' '+y2; lx=(ax+bx)/2; ly=my-4; }
      else { var gx=GUT-24-(gk++)*16, axL=leftOf(a), bxL=leftOf(b);
        d='M '+axL+' '+ay+' L '+gx+' '+ay+' L '+gx+' '+by+' L '+bxL+' '+by; lx=gx+2; ly=(ay+by)/2; }
      o.push('<path d="'+d+'" fill="none" stroke="#5a6472" stroke-width="1.4" marker-end="url(#arr)"'+(e.dashed?' stroke-dasharray="5 3"':'')+'/>');
      if(e.label){ var tw=e.label.length*5.6+8; o.push('<rect x="'+(lx-tw/2)+'" y="'+(ly-8)+'" width="'+tw+'" height="14" rx="3" fill="#E9EDF0" stroke="rgba(0,0,0,0.08)"/>');
        o.push('<text x="'+lx+'" y="'+(ly+2.5)+'" text-anchor="middle" font-size="9.5" fill="#333">'+esc(e.label)+'</text>'); }
    });

    nodes.forEach(function(n){
      var lane=lanes[laneIdx[n.lane]], cx=laneX(n.lane), cy=rowY(n.row);
      if(n.type==='start'||n.type==='end'){
        o.push('<circle cx="'+cx+'" cy="'+cy+'" r="15" fill="'+(n.type==='end'?'#111':'#fff')+'" stroke="#111" stroke-width="'+(n.type==='end'?3:2)+'"/>');
        if(n.type==='end') o.push('<circle cx="'+cx+'" cy="'+cy+'" r="8" fill="#111"/>');
      } else if(n.type==='endko'){
        o.push('<circle cx="'+cx+'" cy="'+cy+'" r="16" fill="#c62828" stroke="#b71c1c" stroke-width="3"/>');
        var ls0=n.text.split('\n'); ls0.forEach(function(t,i){ o.push('<text x="'+cx+'" y="'+(cy+30+ i*11)+'" text-anchor="middle" font-size="9" fill="#c62828">'+esc(t)+'</text>'); });
      } else if(n.type==='gw'){
        var r=22; o.push('<polygon points="'+cx+','+(cy-r)+' '+(cx+r)+','+cy+' '+cx+','+(cy+r)+' '+(cx-r)+','+cy+'" fill="#FFF8E1" stroke="#f9a825" stroke-width="1.6"/>');
        var ls=n.text.split('\n').map(function(t){return t.length>22?t.slice(0,21)+'…':t;});
        ls.forEach(function(t,i){ o.push('<text x="'+(cx+r+7)+'" y="'+(cy+3+ (i-(ls.length-1)/2)*12)+'" text-anchor="start" font-size="9.5" font-weight="600" fill="#e65100">'+esc(t)+'</text>'); });
      } else {
        var isIdok=n.type==='idok', w=laneW-72, h=52, x=cx-w/2, y=cy-h/2;
        var fill=isIdok?'#E3F2FD':lane.fill, strk=isIdok?'#1565c0':lane.stroke, tx=isIdok?'#0d47a1':lane.tx, rx=isIdok?26:8;
        o.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'" fill="'+fill+'" stroke="'+strk+'" stroke-width="1.4"/>');
        var maxc=Math.floor((w-16)/6.0);
        var ls=n.text.split('\n').map(function(t){return t.length>maxc?t.slice(0,maxc-1)+'…':t;});
        ls.forEach(function(t,i){ o.push('<text x="'+cx+'" y="'+(cy+4+ (i-(ls.length-1)/2)*12)+'" text-anchor="middle" font-size="10.5" fill="'+tx+'">'+esc(t)+'</text>'); });
      }
    });
    o.push('</svg>');
    return o.join('');
  }

  var host=$('host'), wrap=$('wrap'), scale=1;
  function applyScale(){ var s=host.querySelector('svg'); if(!s) return; var w=+s.getAttribute('width'),h=+s.getAttribute('height'); s.style.width=(w*scale)+'px'; s.style.height=(h*scale)+'px'; $('zl').textContent=Math.round(scale*100)+'%'; }
  host.innerHTML=build(model); applyScale();
  $('z-in').onclick=function(){ scale=Math.min(4,scale*1.2); applyScale(); };
  $('z-out').onclick=function(){ scale=Math.max(0.2,scale/1.2); applyScale(); };
  $('fit').onclick=function(){ var s=host.querySelector('svg'); if(!s) return; scale=Math.min(4,Math.max(0.15,(wrap.clientWidth-28)/(+s.getAttribute('width')))); applyScale(); wrap.scrollLeft=0; };
  wrap.addEventListener('wheel',function(e){ if(e.ctrlKey||e.metaKey){ e.preventDefault(); scale=Math.min(4,Math.max(0.15,scale*(e.deltaY<0?1.1:1/1.1))); applyScale(); } },{passive:false});
  var pan=false,sx,sy,sl,st;
  wrap.addEventListener('mousedown',function(e){ pan=true; wrap.classList.add('grabbing'); sx=e.clientX; sy=e.clientY; sl=wrap.scrollLeft; st=wrap.scrollTop; });
  window.addEventListener('mouseup',function(){ pan=false; wrap.classList.remove('grabbing'); });
  window.addEventListener('mousemove',function(e){ if(!pan) return; wrap.scrollLeft=sl-(e.clientX-sx); wrap.scrollTop=st-(e.clientY-sy); });
  var app=$('app');
  $('fs').onclick=function(){ try{ if(!document.fullscreenElement){ (app.requestFullscreen||app.webkitRequestFullscreen).call(app);} else document.exitFullscreen(); }catch(e){} };
  $('dl').onclick=function(){ try{ var s=host.querySelector('svg').cloneNode(true); s.setAttribute('xmlns','http://www.w3.org/2000/svg');
    var str='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(s);
    var url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml'})); var a=document.createElement('a'); a.href=url; a.download='swimlane.svg'; document.body.appendChild(a); a.click(); a.remove();
    try{window.open(url,'_blank');}catch(e){} setTimeout(function(){URL.revokeObjectURL(url);},20000);
  }catch(e){} };
  requestAnimationFrame(function(){ $('fit').click(); });
})();
</script>
