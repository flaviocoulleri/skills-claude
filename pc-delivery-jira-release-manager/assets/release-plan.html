<!--
  VISTA — Armado de release/versión (pc-delivery-jira-release-manager, PASO 4).
  Se pasa como widget_code a mcp__visualize__show_widget.
  El skill reemplaza SOLO el objeto `const PLAN = ...` (anclar en esa línea y su marcador de fin,
  NO en este comentario):
    { "projectKey":"ZCLAUDE",
      "version":{"name":"1.0","releaseDate":"2026-08-15","description":""},
      "candidates":[ {"key":"ZCLAUDE-12","summary":"...","type":"Story","epic":"Cotizaciones"} ] }
  El PM ajusta la versión, tilda los issues y ve el preview de release notes (agrupadas por Epic).
  Al confirmar, serializa la versión + issues tildados por sendPrompt. CSS/JS FIJO. Tokens. Dark-safe.
-->
<div id="pc-jira-release">
  <style>
    #pc-jira-release { padding:1rem 0; font-family:var(--font-sans); color:var(--text-primary); }
    #pc-jira-release .eyebrow { font-size:12px; color:var(--text-muted); margin-bottom:4px; }
    #pc-jira-release .title { font-size:22px; font-weight:500; }
    #pc-jira-release .grid { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
    #pc-jira-release .fld { display:flex; flex-direction:column; gap:4px; }
    #pc-jira-release label { font-size:12px; color:var(--text-secondary); }
    #pc-jira-release input { font-size:13px; font-family:var(--font-sans); color:var(--text-primary); background:var(--surface-2); border:1px solid var(--border-strong); border-radius:7px; padding:7px 10px; }
    #pc-jira-release .cols { display:flex; gap:16px; flex-wrap:wrap; }
    #pc-jira-release .col { flex:1; min-width:260px; }
    #pc-jira-release h4 { font-size:13px; margin:0 0 8px; color:var(--text-secondary); }
    #pc-jira-release .row { display:flex; gap:9px; align-items:center; padding:7px 0; border-top:1px solid var(--border); }
    #pc-jira-release .row .k { font-size:11px; color:var(--text-muted); flex:none; width:92px; }
    #pc-jira-release .row .s { flex:1; font-size:13px; }
    #pc-jira-release .notes { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px; white-space:pre-wrap; color:var(--text-primary); min-height:60px; }
    #pc-jira-release .actions { display:flex; gap:10px; align-items:center; margin-top:16px; }
    #pc-jira-release .go { border:none; cursor:pointer; background:var(--text-accent); color:var(--surface-2); font-size:14px; font-weight:600; padding:10px 20px; border-radius:8px; display:inline-flex; gap:7px; align-items:center; }
    #pc-jira-release .rel { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
    #pc-jira-release .ctxbtn { border:1px solid var(--border); cursor:pointer; background:transparent; color:var(--text-secondary); font-size:12px; padding:8px 13px; border-radius:8px; }
  </style>

  <div class="eyebrow">Jira · delivery · revisa la release antes de crearla</div>
  <div class="title">Armado de release</div>

  <div class="grid" id="verForm"></div>

  <div class="cols">
    <div class="col"><h4>Issues candidatos (Done sin versión)</h4><div id="list"></div></div>
    <div class="col"><h4>Release notes (preview)</h4><div class="notes" id="notes"></div></div>
  </div>

  <div class="actions">
    <button class="go" id="go"><i class="ti ti-tag"></i>Crear la versión</button>
    <label class="rel"><input type="checkbox" id="markRel"> marcar como released</label>
    <button class="ctxbtn" id="ctx"><i class="ti ti-plug-connected"></i>Revisar contexto (GoLive/SF)</button>
  </div>
</div>
<script>
  const PLAN = /*__PLAN__*/{
    "projectKey":"ZCLAUDE",
    "version":{"name":"1.0","startDate":"2026-07-13","releaseDate":"2026-08-15","driver":"Ariel Tarsitano","description":""},
    "candidates":[
      {"key":"ZCLAUDE-12","summary":"Cargar la quote desde el banco","type":"Story","epic":"Cotizaciones"},
      {"key":"ZCLAUDE-14","summary":"Fix cálculo de totales","type":"Bug","epic":"Cotizaciones"}
    ]
  }/*__END__*/;

  const vf=document.getElementById('verForm'); const vinp={};
  [['name','Nombre'],['startDate','Inicio'],['releaseDate','Fecha de release'],['driver','Driver'],['description','Descripción']].forEach(([k,l])=>{
    const w=document.createElement('div'); w.className='fld';
    const lab=document.createElement('label'); lab.textContent=l;
    const inp=document.createElement('input'); inp.type=(k==='releaseDate'||k==='startDate')?'date':'text'; inp.value=PLAN.version[k]||'';
    vinp[k]=inp; w.appendChild(lab); w.appendChild(inp); vf.appendChild(w);
  });

  const list=document.getElementById('list'); const reg=[];
  PLAN.candidates.forEach(c=>{
    const row=document.createElement('div'); row.className='row';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    row.appendChild(cb);
    row.insertAdjacentHTML('beforeend','<span class="k">'+c.key+'</span><span class="s">'+c.summary+'</span>');
    cb.addEventListener('change',renderNotes); reg.push({c,cb}); list.appendChild(row);
  });

  function renderNotes(){
    const inc=reg.filter(r=>r.cb.checked).map(r=>r.c);
    const byEpic={}; inc.forEach(c=>{ (byEpic[c.epic||'General']=byEpic[c.epic||'General']||[]).push(c); });
    let txt='';
    Object.keys(byEpic).forEach(ep=>{ txt+='## '+ep+'\n'; byEpic[ep].forEach(c=> txt+='- ['+c.type+'] '+c.summary+' ('+c.key+')\n'); txt+='\n'; });
    document.getElementById('notes').textContent = txt.trim() || '(sin issues seleccionados)';
  }
  renderNotes();

  document.getElementById('go').onclick=()=>{
    const keys=reg.filter(r=>r.cb.checked).map(r=>r.c.key);
    const version={name:vinp.name.value.trim(),startDate:vinp.startDate.value,releaseDate:vinp.releaseDate.value,driver:vinp.driver.value.trim(),description:vinp.description.value.trim()};
    const released=document.getElementById('markRel').checked;
    sendPrompt('CONFIRMO: crea la release en '+PLAN.projectKey+(released?' y márcala como released':'')+'. Datos (JSON): '+JSON.stringify({version,issues:keys,released}));
  };
  document.getElementById('ctx').onclick=()=> sendPrompt('revisa el contexto de la release en '+PLAN.projectKey+': GoLive en Salesforce Project__c y el Project Details de Jira, y notas de versiones previas en Drive');
</script>
