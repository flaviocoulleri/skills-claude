<!--
  skill-explanation-panel.html — widget de EXPLICACIÓN de un skill (Modo Explicar).
  Q01: markup fijo acá. Q08: botones cableados en este archivo.
  DATOS (único placeholder): __SKILL_JSON__ = ficha completa de UN skill:
    { name, area, type, one_liner, connectors:[...], connectors_source,
      when_to_use:[...], writes:bool, steps:[...], help_quality }
  Comportamiento (NO editar por corrida): pinta la ficha + 2 botones de pie
  ("Ver otro skill", "Usar este skill ahora"); el prompt de "usar" se arma en JS
  desde el name/when_to_use inyectados.
-->
<h2 class="sr-only">Cómo funciona este skill</h2>
<div id="exp-root" style="padding: 8px 0; font-family: var(--font-sans, system-ui, sans-serif);"></div>

<script>
(function () {
  var S = __SKILL_JSON__;
  if (!S || typeof S !== "object") S = {};

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var AREA_LABEL = {
    administracion: "Administración", comercial: "Comercial", delivery: "Delivery",
    devops: "DevOps", legales: "Legales", marketing: "Marketing",
    meta: "Meta / transversales", rrhh: "RR. HH."
  };

  // Conectores: el verbo y la advertencia dependen de la confianza de la fuente.
  function connectorsBlock() {
    var src = S.connectors_source || "inferred";
    var list = S.connectors || [];
    var heading, note = "";
    if (src === "declared") {
      heading = list.length ? "Conectores que usa" : "Conectores";
    } else if (src === "requiere-line") {
      heading = "Conectores que requiere";
    } else if (src === "inferred") {
      heading = "Conectores que probablemente usa";
      note = "Inferido de menciones en el skill; puede no ser exacto.";
    } else {
      heading = "Conectores";
    }
    var body;
    if (!list.length) {
      body = '<span style="font-size:13px; color:var(--color-text-secondary);">' +
        (src === "declared" ? "No usa conectores externos." : "No detecté conectores externos.") + '</span>';
    } else {
      body = list.map(function (c) {
        return '<span style="display:inline-block; font-size:12px; line-height:1;' +
          ' padding:5px 9px; margin:0 6px 6px 0; border-radius:999px;' +
          ' background:var(--color-background-tertiary, rgba(128,128,128,.14));' +
          ' color:var(--color-text-primary);">' + esc(c) + '</span>';
      }).join("");
    }
    return section(heading, '<div>' + body + '</div>' +
      (note ? '<p style="font-size:12px; color:var(--color-text-tertiary); margin:6px 0 0;">' + esc(note) + '</p>' : ''));
  }

  function section(title, innerHTML) {
    return '<div style="margin:0 0 16px;">' +
      '<h3 style="font-size:12px; text-transform:uppercase; letter-spacing:.04em;' +
      ' color:var(--color-text-tertiary); margin:0 0 8px;">' + esc(title) + '</h3>' +
      innerHTML + '</div>';
  }

  function stepsBlock() {
    var steps = S.steps || [];
    if (!steps.length) {
      return section("Paso a paso",
        '<p style="font-size:13px; color:var(--color-text-secondary); margin:0;">' +
        'El paso a paso no está documentado en detalle para este skill. Pídeme un resumen y te lo explico en prosa.</p>');
    }
    var items = steps.map(function (st) {
      return '<li style="margin:0 0 6px; font-size:13px; color:var(--color-text-secondary);">' + esc(st) + '</li>';
    }).join("");
    return section("Paso a paso", '<ol style="margin:0; padding-left:20px;">' + items + '</ol>');
  }

  function triggersBlock() {
    var t = S.when_to_use || [];
    if (!t.length) return "";
    var items = t.map(function (q) {
      return '<li style="margin:0 0 5px; font-size:13px; color:var(--color-text-secondary);">' +
        '“' + esc(q) + '”</li>';
    }).join("");
    return section("Cuándo usarlo (frases que lo activan)",
      '<ul style="margin:0; padding-left:20px; list-style:none;">' + items + '</ul>');
  }

  function writesBlock() {
    if (!S.writes) return "";
    return '<div style="margin:0 0 16px; padding:10px 12px; border-radius:var(--border-radius-md,8px);' +
      ' background:var(--color-background-tertiary, rgba(128,128,128,.12));' +
      ' border-left:3px solid var(--color-warning, #d98a00);">' +
      '<p style="font-size:13px; color:var(--color-text-primary); margin:0;">' +
      '⚠️ Este skill <strong>crea o actualiza registros</strong>. Siempre te pide confirmación antes de escribir.</p></div>';
  }

  var header = '<div style="margin:0 0 14px;">' +
    '<div style="display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;">' +
      '<span style="font-weight:700; font-size:16px; color:var(--color-text-primary);">' + esc(S.name || "—") + '</span>' +
      (S.type ? '<span style="font-size:12px; color:var(--color-text-tertiary);">' + esc(S.type) + '</span>' : '') +
    '</div>' +
    (S.area ? '<div style="font-size:12px; color:var(--color-text-tertiary); margin-top:2px;">' +
      esc(AREA_LABEL[S.area] || S.area) + '</div>' : '') +
    '</div>';

  var whatBlock = section("Qué hace",
    '<p style="font-size:14px; color:var(--color-text-secondary); margin:0;">' + esc(S.one_liner || "") + '</p>');

  var footer = '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">' +
    '<button type="button" id="btn-other"' +
      ' style="cursor:pointer; padding:9px 14px; font-size:13px; border-radius:var(--border-radius-md,8px);' +
      ' border:1px solid var(--color-border, rgba(128,128,128,.25)); background:var(--color-background-secondary); color:inherit;">' +
      '← Ver otro skill</button>' +
    '<button type="button" id="btn-use"' +
      ' style="cursor:pointer; padding:9px 14px; font-size:13px; border-radius:var(--border-radius-md,8px);' +
      ' border:1px solid transparent; background:var(--color-primary, #2563eb); color:#fff;">' +
      'Usar este skill ahora ↗</button>' +
    '</div>';

  document.getElementById("exp-root").innerHTML =
    header + whatBlock + connectorsBlock() + stepsBlock() + triggersBlock() + writesBlock() + footer;

  // Botones cableados (Q08). sendPrompt con guarda.
  var other = document.getElementById("btn-other");
  var use = document.getElementById("btn-use");
  other.addEventListener("click", function () {
    if (typeof window.sendPrompt === "function") window.sendPrompt("Explícame mis skills");
  });
  use.addEventListener("click", function () {
    if (typeof window.sendPrompt !== "function") return;
    // El prompt de "usar" se arma desde los datos: primer disparador real si existe.
    var trigger = (S.when_to_use && S.when_to_use[0]) ? S.when_to_use[0]
      : ("Quiero usar el skill " + (S.name || ""));
    window.sendPrompt(trigger);
  });
})();
</script>
