<h2 class="sr-only">Confirmación de branding ProContacto</h2>
<style>
.pc-prompt{display:flex;flex-direction:column;align-items:center;padding:1.75rem 1rem 2rem;gap:1rem;max-width:420px;margin:0 auto;text-align:center}
.pc-logo{display:flex;align-items:center;gap:9px}
.pc-mark{font-size:18px;font-weight:500;color:var(--color-text-primary);letter-spacing:-0.02em;font-family:var(--font-sans)}
.pc-mark span{font-weight:400;color:var(--color-text-secondary)}
.pc-q{font-size:15px;font-weight:500;color:var(--color-text-primary);margin:0;line-height:1.4;font-family:var(--font-sans)}
.pc-sub{font-size:13px;color:var(--color-text-secondary);margin:0;line-height:1.5;font-family:var(--font-sans)}
.pc-divider{width:40px;height:0.5px;background:var(--color-border-tertiary)}
.pc-btns{display:flex;gap:10px;margin-top:0.25rem}
.pc-yes{background:#0062FF;color:#fff;border:none;border-radius:var(--border-radius-md);padding:9px 22px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-sans);display:flex;align-items:center;gap:5px;transition:opacity 140ms}
.pc-yes:hover{opacity:0.88}
.pc-yes:active{transform:scale(.98)}
.pc-no{background:transparent;color:var(--color-text-secondary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:9px 22px;font-size:13px;font-weight:400;cursor:pointer;font-family:var(--font-sans);display:flex;align-items:center;gap:5px}
.pc-no:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.pc-no:active{transform:scale(.98)}
</style>
<div class="pc-prompt">
  <div class="pc-logo">
    <svg width="26" height="26" viewBox="0 0 152 152" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M119.112 103.567C103.9 103.567 91.5704 115.909 91.5691 131.134L91.5585 131.139H104.223L82.6336 152L62.5327 131.139H75.2024L75.1918 131.134C75.193 106.856 94.8551 87.1752 119.112 87.1752V103.567Z" fill="#0062FF"/>
      <path d="M20.8425 75.2578L20.8478 75.2525C45.1053 75.2525 64.7679 94.9377 64.7679 119.217H48.3905C48.3905 103.991 36.0601 91.6496 20.8478 91.6496L20.8425 91.6389V104.314L0 82.7062L20.8425 62.5876V75.2578Z" fill="#0062FF"/>
      <path d="M103.476 32.7835C103.476 48.0092 115.806 60.3504 131.019 60.3504L131.024 60.3557V47.6855L151.867 69.2938L131.024 89.4124V76.7369L131.019 76.7475C106.761 76.7475 87.0987 57.0623 87.0987 32.7835H103.476Z" fill="#0062FF"/>
      <path d="M89.3339 20.8608H76.6696L76.6802 20.8661C76.6789 45.1439 57.0168 64.8248 32.76 64.8248V48.433C47.9716 48.433 60.3015 36.0907 60.3028 20.8661L60.3134 20.8608H47.6437L69.233 0L89.3339 20.8608Z" fill="#0062FF"/>
    </svg>
    <div class="pc-mark">Pro<span>Contacto</span></div>
  </div>
  <div class="pc-divider"></div>
  <p class="pc-q">¿Aplicar el branding de ProContacto?</p>
  <p class="pc-sub">Colores, tipografía, logo y tono de voz oficial de la marca</p>
  <div class="pc-btns">
    <button class="pc-yes" onclick="sendPrompt('Sí, aplicar el branding de ProContacto')">
      <i class="ti ti-check" aria-hidden="true"></i> Sí, aplicar
    </button>
    <button class="pc-no" onclick="sendPrompt('No, continuar sin branding de ProContacto')">
      <i class="ti ti-x" aria-hidden="true"></i> No, gracias
    </button>
  </div>
</div>
